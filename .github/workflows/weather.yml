name: Update weather
on:
  schedule:
    # every 6 hours: 4:30 AM, 10:30 AM, 4:30 PM, 10:30 PM Pacific Daylight Time
    # 4 runs x ~2,000 weighted calls = ~8,000 of Open-Meteo's 10,000/day free allowance
    - cron: '30 11,17,23,5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    # Only production fetches weather. The staging mirror (misherr/wheretoforage-dev) is a full copy of
    # this tree, so without this guard it runs the same schedule and doubles the Open-Meteo spend —
    # it did exactly that once, 465 calls, and committed the result to its own branch, which also put a
    # commit on preview/dev that dev did not have. Staging reads production's archive over CORS instead.
    if: github.repository == 'misherr/wheretoforage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check for data/cells.json
        run: |
          if [ ! -f data/cells.json ]; then
            echo "::error::data/cells.json is missing. Run the app locally with PUBLIC_MODE=false, wait for a full load, then use the info panel's 'Export cells.json' button and upload the file to data/cells.json in this repo."
            exit 1
          fi
          echo "cells.json found: $(wc -c < data/cells.json) bytes"
      - name: Fetch weather
        run: node scripts/fetch-weather.mjs
        timeout-minutes: 25
      - name: Commit
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add data/weather.json
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "weather $(date -u +'%F %H:%M')"
          git push
