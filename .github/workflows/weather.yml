name: Update weather
on:
  schedule:
    # every 6 hours: 4:30 AM, 10:30 AM, 4:30 PM, 10:30 PM Pacific Daylight Time
    # 4 runs x ~2,000 weighted calls = ~8,000 of Open-Meteo's 10,000/day free allowance
    - cron: '30 11,17,23,5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-weather.mjs
      - run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add data/weather.json
          git commit -m "weather $(date -u +%F)" || exit 0
          git push
