<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a2419">
<title>Bolete Washington</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --moss:#1a2419; --moss-2:#243226; --bark:#4a3a2a; --cap:#b8742c; --cap-light:#e0a559;
  --pore:#e9e2cf; --pore-dim:#b8b09a; --line:rgba(233,226,207,.14);
  --c-med:#e2c452; --c-good:#e58a2b; --c-high:#d6432c; --c-vhigh:#8a1a30;
  --sheet-h:46dvh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--moss);color:var(--pore);
  font-family:"Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.4;overscroll-behavior:none}
#map{position:fixed;inset:0;background:#0f150f}
.leaflet-container{font:inherit}
.leaflet-control-attribution{font-size:9px;background:rgba(26,36,25,.7)!important;color:var(--pore-dim)!important}
.leaflet-control-attribution a{color:var(--cap-light)!important}
.leaflet-control-zoom{display:none}

/* top strip */
#top{position:fixed;top:0;left:0;right:0;z-index:900;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  display:flex;align-items:center;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
#brand{background:var(--moss);border:1px solid var(--line);border-radius:14px;padding:6px 12px;display:flex;flex-direction:column;min-width:0;flex:1}
#brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--pore)}
#brand h1 em{font-style:normal;color:var(--cap-light)}
#brand small{font-size:12px;color:var(--pore-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--moss);border:1px solid var(--line);color:var(--pore);border-radius:14px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill:active{background:var(--moss-2)}
.pill.cap{background:var(--cap);border-color:var(--cap);color:#1a1208}
.pill[disabled]{opacity:.5}
#btn-top{background-image:linear-gradient(105deg,transparent 0%,transparent 42%,rgba(255,255,255,.8) 48%,rgba(255,255,255,.95) 50%,rgba(255,255,255,.8) 52%,transparent 58%,transparent 100%),linear-gradient(180deg,#f8e6ac 0%,#eeca79 14%,#d9a94a 45%,#b8862c 78%,#8f661d 100%);background-size:300% 100%,100% 100%;background-position:200% 0,0 0;background-repeat:no-repeat,no-repeat;color:#2a1608;border:none;text-shadow:0 1px 0 rgba(255,255,255,.35);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 -3px 4px rgba(0,0,0,.28) inset,0 3px 10px rgba(0,0,0,.35),0 2px 12px rgba(232,192,99,.28);animation:shine 7s linear infinite}
@keyframes shine{0%{background-position:200% 0,0 0}100%{background-position:-100% 0,0 0}}
@media (prefers-reduced-motion:reduce){#btn-top{animation:none}}

/* right rail */
#rail{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 70px);z-index:900;display:flex;flex-direction:column;gap:8px}
#rail button{width:44px;height:44px;border-radius:12px;background:var(--moss);border:1px solid var(--line);color:var(--pore);font-size:20px;cursor:pointer;display:grid;place-items:center}
#rail button:active{background:var(--moss-2)}
#rail button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* layers menu */
#layers{position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 70px);z-index:910;background:var(--moss);border:1px solid var(--line);border-radius:14px;padding:6px 6px;display:none;min-width:210px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
/* Paste a coordinate and go there. Same panel treatment as #layers so the rail behaves consistently. */
#goto{position:fixed;right:60px;top:calc(env(safe-area-inset-top) + 70px);z-index:910;background:var(--moss);border:1px solid var(--line);border-radius:14px;padding:10px;display:none;width:min(320px,calc(100vw - 80px));box-shadow:0 8px 30px rgba(0,0,0,.4)}
#goto.open{display:block}
#goto input{width:100%;box-sizing:border-box;background:var(--moss-2);border:1px solid var(--line);color:var(--pore);border-radius:10px;padding:9px 10px;font-size:15px;font-family:inherit}
#goto .row{display:flex;gap:6px;margin-top:8px}
#goto .row .pill{flex:1;text-align:center}
#goto small{display:block;color:var(--pore-dim);font-size:11px;line-height:1.5;margin-top:8px}
#goto .err{color:var(--c-med);font-size:12px;margin-top:6px;display:none}
#goto .err.show{display:block}
/* The coordinate readout on the sheet: monospace so digits line up, selectable so it can be copied
   by hand when the clipboard API is unavailable (an insecure origin, or a browser that refuses). */
.coords{display:flex;align-items:center;gap:8px;margin:10px 0 0}
.coords code{background:var(--moss-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;user-select:all;-webkit-user-select:all;flex:1}
#layers.open{display:block}
#layers label{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;font-size:14px;cursor:pointer}
#layers label:active{background:var(--moss-2)}
#layers input{width:18px;height:18px;accent-color:var(--cap)}
#layers label i{width:12px;height:12px;border-radius:3px;flex:none}
#layers label small{color:var(--pore-dim);font-size:11px;display:block}

/* bottom timeline */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:900;background:var(--moss);border-top:1px solid var(--line);padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);transition:transform .25s}
body.sheet-open #bottom{transform:translateY(120%)}
#legends{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--pore-dim);margin-bottom:6px}
#legends .lg{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#legends .lg b{font-weight:600;color:var(--pore);margin-right:2px}
#legends i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-2px;margin-right:3px}
#tl{display:flex;align-items:center;gap:10px}
#play{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--moss-2);color:var(--pore);font-size:16px;cursor:pointer;flex:none;display:grid;place-items:center}
#play svg{width:18px;height:18px;fill:currentColor}
#tl .s{flex:1;min-width:0}
#day{display:flex;justify-content:space-between;font-size:11px;color:var(--pore-dim);margin-bottom:2px}
#day b{color:var(--cap-light);font-weight:600}
#slider{width:100%;margin:0;accent-color:var(--cap);height:28px}
#ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--pore-dim);padding:0 2px}
#ticks span.on{color:var(--cap-light);font-weight:700}

/* progress */
#prog{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 130px);z-index:900;background:var(--moss);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;display:none;transition:transform .25s}
#prog .bar{height:4px;border-radius:2px;background:var(--moss-2);margin-top:6px;overflow:hidden}
#prog .bar b{display:block;height:100%;width:0;background:var(--cap-light);transition:width .2s}
body.sheet-open #prog{transform:translateY(calc(-1 * var(--sheet-h)))}

/* tap hint */
#tap-hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 114px);transform:translateX(-50%);z-index:895;background:var(--moss);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:11px;color:var(--pore-dim);white-space:nowrap;pointer-events:none;display:none;opacity:1;transition:opacity .4s}
#tap-hint.fade{opacity:0}
body.sheet-open #tap-hint{opacity:0}

/* bottom sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;height:var(--sheet-h);z-index:950;background:var(--moss);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
#sheet.open{transform:translateY(0)}
#sheet.tall{--sheet-h:88dvh}
#grab{width:38px;height:4px;border-radius:2px;background:var(--pore-dim);opacity:.6;margin:8px auto 4px;flex:none}
#sheet-hd{display:flex;align-items:flex-start;gap:10px;padding:4px 16px 8px;flex:none}
#sheet-hd .t{flex:1;min-width:0}
#sheet-hd .t h2{margin:0;font-size:16px;font-weight:600;line-height:1.25}
#sheet-hd .t small{color:var(--pore-dim);font-size:12px}
#close{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--pore);font-size:16px;cursor:pointer}
#sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(env(safe-area-inset-bottom) + 20px);flex:1}

.verdict{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--moss-2);margin-bottom:12px}
.verdict .num{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;min-width:60px;text-align:center;flex:none}
.verdict .num small{display:block;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--pore-dim);margin-top:4px}
.verdict p{margin:0;font-size:14px;line-height:1.35}
.verdict p b{font-weight:600}
.stage{display:flex;gap:11px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--moss-2);margin-bottom:12px;cursor:pointer}
.stage b{font-size:14px;font-weight:600;display:block}
.stage span{font-size:12.5px;color:var(--pore-dim);display:block}
.stage .chev{margin-left:auto;flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--moss);color:var(--pore-dim);font-size:16px;transition:transform .2s}
.stage.open{border-radius:12px 12px 0 0;margin-bottom:0}
.stage.open .chev{transform:rotate(180deg)}
.stage-detail{background:var(--moss-2);border-radius:0 0 12px 12px;padding:2px 12px 12px;margin-bottom:12px}
.stage-detail .bars .k{display:flex;align-items:center;gap:6px}
.stage-detail .bars svg{width:16px;height:16px;flex:none}
.elev-bars .k{display:flex;align-items:center;gap:6px}
.elev-bars svg{width:16px;height:16px;flex:none}

.sec{margin:14px 0 6px;font-size:12px;color:var(--pore-dim);font-weight:600}
/* A figure that is real but should not be read at face value. Muted gold, reused from the score
   bands rather than a new colour, and no icon: it is a caveat, not an error. */
.caveat{color:var(--c-med)}
.bars{display:grid;grid-template-columns:118px 1fr 40px;gap:6px 10px;align-items:center;font-size:13px}
.bars .bg{height:8px;border-radius:4px;background:var(--moss-2);overflow:hidden}
.bars .bg b{display:block;height:100%;border-radius:4px;background:var(--cap-light)}
.bars .v{text-align:right;color:var(--pore-dim);font-variant-numeric:tabular-nums}
.bars .k{color:var(--pore)}
.note{font-size:12.5px;color:var(--pore-dim);margin:6px 0 0}

.fc{display:flex;gap:4px;align-items:flex-end;height:74px;margin-top:6px}
.fc div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:10px;color:var(--pore-dim);cursor:pointer}
.fc div b{width:100%;border-radius:4px 4px 2px 2px;min-height:2px}
.fc div.today span{color:var(--cap-light);font-weight:700}

.rain{display:flex;gap:3px;align-items:flex-end;height:54px;margin-top:6px}
.rain div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center;gap:2px;font-size:9px;color:var(--pore-dim)}
.rain div b{width:100%;background:#5b8fb0;border-radius:2px;min-height:1px}
.rain div.hi b{background:#7fb3d3}

dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0 0;font-size:13px}
dl dt{color:var(--pore-dim)}dl dd{margin:0}
a.lnk{color:var(--cap-light);text-decoration:none;font-weight:600}
.actions{display:flex;gap:8px;margin-top:12px}

/* top spots + model panels share sheet */
a.drawway{color:var(--cap-light);text-decoration:underline;font-size:13px}
.sortbar{display:flex;gap:6px;align-items:center;padding:8px 0 4px;font-size:12px;color:var(--pore-dim)}
.sortbar .pill{font-size:12px;padding:4px 10px}
.sortbar .pill.on{background:var(--cap);border-color:var(--cap);color:#1a1409}
.spot{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.spot .sc{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;font-size:18px;font-weight:700;color:#fff;flex:none}
.spot .m{flex:1;min-width:0}.spot .m b{display:block;font-size:14px;font-weight:600}.spot .m span{font-size:12px;color:var(--pore-dim)}
.model p{font-size:13.5px;margin:8px 0}.model h3{font-size:14px;margin:16px 0 4px;color:var(--cap-light)}
.model ul{padding-left:18px;font-size:13px;margin:4px 0}.model li{margin:3px 0}

.cell{cursor:pointer}
.empty{padding:20px 0;color:var(--pore-dim);font-size:13.5px}
@media (prefers-reduced-motion:reduce){#sheet,#legend,#prog{transition:none}}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div id="brand"><h1><em>King bolete</em> Washington</h1><small id="status">Loading…</small></div>
  <button class="pill cap" id="btn-top">Top spots</button>
</div>

<div id="rail">
  <button id="btn-loc" title="My location"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
  <button id="btn-base" title="Map style"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></button>
  <button id="btn-refine" title="Refine this area" style="display:none"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/><path d="M11 8v6M8 11h6"/></svg></button>
  <button id="btn-goto" title="Go to coordinates"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.3-6-10a6 6 0 1 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg></button>
  <button id="btn-layers" title="Layers"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg></button>
  <button id="btn-model" title="How it works"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
  <button id="btn-refresh" title="Refresh weather"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg></button>
</div>

<div id="layers" class="open"></div>

<div id="goto">
  <input id="goto-input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false"
         placeholder="47.45125, -119.93630" aria-label="Coordinates">
  <div class="err" id="goto-err"></div>
  <div class="row"><button class="pill cap" id="goto-add">Go</button><button class="pill" id="goto-close">Close</button></div>
  <small>Decimal degrees, or the degrees-minutes-seconds the iPhone Compass shows &mdash;
    <code>47°27'04" N 119°56'11" W</code>. Hemisphere letters or a minus sign both work.</small>
</div>

<div id="bottom">
  <div id="legends"></div>
  <div id="tl">
    <button id="play" title="Play forecast"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
    <div class="s"><div id="day"><span id="day-lbl"></span><b id="day-tag">Today</b></div><input id="slider" type="range" min="0" max="7" step="1" value="0"><div id="ticks"></div></div>
  </div>
</div>

<div id="tap-hint">Tap anywhere on the map for that spot's forecast</div>

<div id="prog" style="display:block"><span id="prog-txt">Loading the map…</span><div class="bar"><b id="prog-bar"></b></div></div>

<div id="sheet">
  <div id="grab"></div>
  <div id="sheet-hd"><div class="t"><h2 id="sh-title"></h2><small id="sh-sub"></small></div><button id="close">✕</button></div>
  <div id="sheet-body"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- The ecological model lives in src/model/ — see src/model/CLAUDE.md. Everything below is the
     application around it: map rendering, data loading, the tap sheet and UI state.
     ES modules are fetched, so this page needs a server; opening index.html over file:// fails CORS. -->
<script type="module">
import { clamp, trap, ft, f, inch, fmtDay, bandOf, labelOf } from './src/model/util.mjs';
import { habitat, everHabitat } from './src/model/habitat.mjs';
import { LAPSE, adjustWeather, analyze, fullAnalysis, verdict } from './src/model/weather-score.mjs';
import { STAGE_KEYS, STAGE_LABELS, stageBreakdown, stageOf } from './src/model/phenology.mjs';
import { hostOf, HOST_NO_INFO, vegMult, vegSummary, hostFromSamples } from './src/model/vegetation.mjs';
import { makeEntry, applyVeg } from './src/model/cell.mjs';
// The cell lattice, the state outline and terrainAt() are shared with scripts/build-cells.mjs, which
// bakes data/cells.json. A second copy of this geometry would drift, and the symptom is a blank map.
import { DLAT, DLON, BLK, BLAT, BLON, inWA, cellCenter, cellKey,
         terrainAt, pointKey as key } from './src/grid.mjs';
// Access is a separate axis from suitability and never touches a score — see src/access.mjs.
import { parseCoords, formatCoords } from './src/coords.mjs';
import { classifyAccess, accessDetail, accessRank, accessDistance, gainLabel, externalLinks,
         NO_TRAILHEAD_NOTE, decodeRow as decodeAccessRow, decodeWay as decodeAccessWay,
         CLASSES as ACCESS_CLASSES, ACCESS_FORMAT, accessAt, CELL_SCOPE_NOTE,
         NOT_EXAMINED_LABEL, NOT_EXAMINED_NOTE, OFF_TRAIL_NOTE,
         NO_ON_TRAIL_NOTE, onRouteLabel } from './src/access.mjs';
/* ===================== CONFIG ===================== */
const PUBLIC_MODE=true; // true for a public deployment: never call Open-Meteo or LANDFIRE from the browser; rely on data/cells.json + data/weather.json
const FINE_SIZES=[0.007,0.005,0.0035], FINE_CAP=400; // local refine below 1 mi when zoomed way in
const PAST_DAYS = 26, FC_DAYS = 8, ANCHOR = 0.2; // 26 days covers the 3–24 day trigger window; anchors every ~14 mi keep the load under Open-Meteo's free quota

/* ===================== HELPERS ===================== */
const $=id=>document.getElementById(id);
function doyOf(d){ const s=new Date(d.getFullYear(),0,0); return Math.floor((d-s)/86400000); }
function localISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const shortDay=iso=>new Date(iso+'T12:00:00').toLocaleDateString(undefined,{weekday:'narrow'});
function colorOf(s){ const b=bandOf(s); return b?b[2]:null; }
function dist(a,b){ const R=6371,dl=(b[0]-a[0])*Math.PI/180,dn=(b[1]-a[1])*Math.PI/180; const x=Math.sin(dl/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(x))*0.621371; }

/* real neighbouring cells, bucketed by elevation — thresholds derived from the sample, not from assumed cell size */
function elevationBands(lat,lon,dayIdx){
  const R=3.5, dLat=4/69, dLon=4/(69*Math.cos(lat*Math.PI/180));
  const near=[];
  for(const e of cells.values()){
    if(!e.A||e.failed) continue;
    if(Math.abs(e.lat-lat)>dLat||Math.abs(e.lon-lon)>dLon) continue;
    if(dist([lat,lon],[e.lat,e.lon])>R) continue;
    near.push(e);
  }
  const n=near.length;
  if(n<6) return null;
  const sizeLat=near.reduce((a,e)=>a+e.size,0)/n;
  const sizeLon=near.reduce((a,e)=>a+(e.lonsize||e.size),0)/n;
  const cellAreaSqMi=(sizeLat*69)*(sizeLon*69*Math.cos(lat*Math.PI/180));
  const areaSqMi=n*cellAreaSqMi;
  if(areaSqMi/(Math.PI*R*R)<0.4) return null;
  const elevs=near.map(e=>e.elev);
  const minE=Math.min(...elevs), maxE=Math.max(...elevs);
  if(maxE-minE<120) return {flat:true};
  const k=clamp(Math.round(Math.sqrt(n)),4,10);
  const w=(maxE-minE)/k;
  const buckets=Array.from({length:k},()=>[]);
  near.forEach(e=>{ let b=Math.floor((e.elev-minE)/w); if(b>=k)b=k-1; if(b<0)b=0; buckets[b].push(e); });
  const minKeep=Math.max(2,Math.round(n*0.05));
  const bands=[];
  buckets.forEach((list,b)=>{
    if(list.length<minKeep) return;
    const lo=minE+b*w, hi=(b===k-1)?maxE:minE+(b+1)*w;

      h+=`<div class="stage-detail" id="elev-detail"${elevOpen?'':' hidden'}><div class="bars elev-bars">`+sorted.map(b=>{
        const hl=b===best;
        return `<div class="k"${hl?' style="border-left:3px solid var(--cap);padding-left:6px;margin-left:-9px"':''}>${b.stage?stageIcon(b.stage):''}${ft(b.lo).toLocaleString()}–${ft(b.hi).toLocaleString()} ft</div><div class="bg"><b style="width:${Math.max(0,Math.round(b.score))}%"></b></div><div class="v">${Math.round(b.score)}</div>`;
      }).join('')+`</div><p class="note">From ${eb.n} cells covering about ${Math.round(eb.areaSqMi)} sq mi within 3.5 miles.</p></div>`;
    }
  }
  if(A&&A.fut&&A.fut.length){
    const mx=Math.max(20,...A.fut.map(x=>x.score));
    h+=`<div class="sec">Next 7 days</div><div class="fc">`+A.fut.map((x,i)=>`<div class="${i===t?'today':''}"><span>${Math.round(x.score)}</span><b style="height:${Math.max(3,Math.round(x.score/mx*46))}px;background:${colorOf(x.score)||'#3a4a3b'}"></b><span>${i===0?'Now':shortDay(x.date)}</span></div>`).join('')+`</div>`;
    if(A.fRain>0.5) h+=`<p class="note">${inch(A.fRain)}" of rain forecast over the next week${A.fRain>=20?' — a real trigger':A.fRain>=8?' — helps hold moisture':' — not enough to trigger a new flush'}.</p>`;
  }
  if(now&&now.F!==undefined){
    const n=now;
    h+=`<div class="sec">Why</div><div class="bars">`+bar('Trigger rain',n.F)+bar('Soil moisture',n.M)+bar('Temperatures',n.X)+bar('Humidity',n.Hu)+bar('Habitat & season',hab.score)+`</div>`;
    const bits=[];
    if(n.ev) bits.push(`Best trigger: ${inch(n.ev.mm)}" around ${fmtDay(n.ev.date)} (${n.ev.age} d ago; flushes peak 7–15 d after)`); else bits.push('No rain event ≥0.4" in the 3–24 day trigger window');
    bits.push(`Soil water index ${Math.round(n.bucket)}/80 mm · ${n.dry} dry day${n.dry===1?'':'s'} in a row`);
    bits.push(`Last 5 days ${f(n.mn)}–${f(n.mx)}°F${n.drop>=2?' · cooling trend (+)':''}${n.rh!=null?' · RH '+Math.round(n.rh)+'%':''}`);
    if(n.kill) bits.push(n.kill==='frost'?'Hard frost in the last week':n.kill==='snow'?'Fresh snow in the last week':'Heat ≥86°F in the last 3 days');
    if(e.w&&e.w.meta){ const m=e.w.meta; const parts=[]; if(Math.abs(m.dz)>=30) parts.push(`${m.dT>0?'+':''}${(m.dT*1.8).toFixed(1)}°F lapse-rate correction from the weather grid point at ${ft(m.anchorElev).toLocaleString()} ft`); if(e.terr&&e.terr.aspect!=null&&Math.abs(m.tAsp)>=0.2) parts.push(`${compass(e.terr.aspect)} aspect: ${m.tAsp>0?'warmer':'cooler'} by ~${Math.abs(m.tAsp*1.8).toFixed(1)}°F, ${m.etMul<1?'holds':'loses'} moisture ${Math.round(Math.abs(1-m.etMul)*100)}% ${m.etMul<1?'longer':'faster'}`); if(parts.length) bits.push(parts.join(' · ')); }
    h+=`<p class="note">${bits.join('<br>')}</p>`;
  }
  let pendingWay=null;   // the way the Getting-there section named, for the draw link below
  let vegH='';
  if(e.veg){ const v=e.veg;
    // An absent vegetation type has to say so. Silently dropping the host-quality clause and the Types
    // row made a data failure look like ordinary missing detail — which is exactly how EVT stayed
    // broken across a full bake of 48,032 cells without anyone noticing.
    // Two different gaps, and they must not be described as the same thing. No types at all means
    // LANDFIRE EVT did not resolve. Types but no host figure means the type is known but no sample
    // qualified to score it — which is normal on cells with no tree cover. Either way the cell is
    // being scored on the HOST_NO_INFO penalty, so neither may pass silently.
    const noType=!v.top||!v.top.length, noHost=v.host==null;
    const dim=t=>`<span style="color:var(--pore-dim)">${t}</span>`;
    const hostBit=v.host!=null
      ? ' · host quality '+Math.round(v.host*100)+'/100'
      : ' · '+dim('host quality unavailable — scored at '+Math.round(HOST_NO_INFO*100)+'/100');
    vegH=`<dt>Forest (LANDFIRE 2024)</dt><dd>${Math.round(v.treeFrac*100)}% tree-covered · canopy ${Math.round(v.canopy)}% · stand height ${Math.round(v.height*3.28)} ft${hostBit}</dd>`
      +(noType
        ? `<dt>Types</dt><dd>${dim('Vegetation type unavailable — LANDFIRE EVT did not resolve here, so this cell is scored at '+Math.round(HOST_NO_INFO*100)+'/100 host quality: a penalty for missing data, not a measurement. Cover and height above are real.')}</dd>`
        : `<dt>Types</dt><dd>${v.top.map(t=>`${Math.round(t.share*100)}% ${t.name}${t.host?' '+dim('('+t.host.lab+')'):''}`).join('<br>')}${noHost?'<br>'+dim('No sample qualified for a host-quality score here.'):''}</dd>`); }
  else if(!vegBroken&&hab.score>0.08) vegH=`<dt>Forest</dt><dd style="color:var(--pore-dim)">Vegetation check pending</dd>`;
  h+=`<div class="sec">Ecology</div><dl>${vegH}<dt>Hosts</dt><dd>${hab.hosts}</dd><dt>Season</dt><dd>${hab.seasonNote}</dd>${hab.elevNote?`<dt>Elevation</dt><dd>${hab.elevNote}</dd>`:''}</dl>`;
  /* Getting there. Deliberately its own section and deliberately below the score: it is not an
     input to the number above it, and the wording says what is MAPPED rather than what exists. */
  if(STATIC.access){
    /* Only when there is access data at all. With no file — or one this build cannot read — the
       section is omitted entirely rather than rendered as "nothing is mapped within about a mile",
       which would be a claim about a lookup that never happened. */
    // `dim` above is scoped to the vegetation branch, which may not have run for this cell.
    const dim=t=>`<span style="color:var(--pore-dim)">${t}</span>`;
    const ac=accessDetail(e.access,STATIC.access.ways,STATIC.access.geom);
    /* Name the route rather than only classifying it: "Forest Road 2703, 0.4 mi" is actionable and
       "trail mapped" is not. Naming it changes nothing about the honesty framing — a named way is
       still only MAPPED here, not confirmed passable, gated, or open this season. */
    /* Whose access this is. An exact point and a sub-mile refine cell are both smaller than the
       square mile access is measured for, so say so rather than letting a cell-centre distance read
       as a distance from the tapped coordinate. */
    const cellScoped=e.exact||(e.size&&e.size<DLAT);
    h+=`<div class="sec">Getting there</div>`
      +(cellScoped?`<div style="margin:-2px 0 6px">${dim(CELL_SCOPE_NOTE)}</div>`:'')
      +`<dl>`;
    /* A point the bake never walked gets said so, rather than borrowing the unknown class's
       "nothing is mapped within about a mile" — which would be a claim about a lookup that never
       happened. It is reachable: a tap goes wherever a finger goes, and 31.5% of in-state taps land
       outside the baked cell set. */
    if(!e.access&&!accessExamined(e.lat,e.lon)){
      h+=`<dt>Access</dt><dd>${NOT_EXAMINED_LABEL}<br>${dim(NOT_EXAMINED_NOTE)}</dd></dl>`;
      pendingWay=-1;
    } else {
      h+=`<dt>Access</dt><dd>`
        +(ac.wayName?`<b>${ac.wayName}</b>`:ac.label)
        +(ac.way&&ac.way.segments>1?' '+dim('('+ac.way.segments+' mapped segments joined)'):'')
        +`<br>${dim(ac.blurb)}`
        +(ac.wayIndex>=0?` <a href="#" class="drawway">Show the approach on the map</a>`:'')+`</dd>`;
      /* The approach, in its two legs. v4 showed one number — along the trail from the trailhead to
         the point nearest the cell — and stopped there, so 924 cells read "0 ft" while the trail was
         up to 1.9 km away. Neither leg alone answers "how far in is it", so both are shown and then
         added, and the off-trail leg carries the note that it is a straight line over unknown ground.

         The legs are rendered even when the on-trail half is unavailable: a cell with no trailhead
         still has a real off-trail distance from a real route, and that is worth more than silence. */
      const P=ac.parts;
      if(P){
        const leg=(m,g)=>accessDistance(m)+(g!=null?` · ${gainLabel(g)||'negligible climb'}`:'');
        h+=`<dt>Getting in</dt><dd>`;
        if(P.onTrail!=null){
          h+=`${leg(P.onTrail,P.onGain)} ${dim(onRouteLabel(ac.cat)+(ac.trailheadNote?', '+ac.trailheadNote:''))}<br>`
            +(P.onGain==null?`${dim('Climb unavailable for this stretch.')}<br>`:'');
        } else {
          h+=`${dim(NO_ON_TRAIL_NOTE)}<br>`;
        }
        h+=`${leg(P.offTrail,P.offGain)} <span class="caveat">off trail</span><br>${dim(OFF_TRAIL_NOTE)}`;
        if(P.total!=null){
          h+=`<br><b>${accessDistance(P.total)} in total${P.totalGain!=null?' · '+(gainLabel(P.totalGain)||'negligible climb'):''}</b>`
            +(P.totalGain==null?` ${dim('(total climb unavailable — one leg is unmeasured)')}`:'');
        }
        h+=(ac.walkDoubt?`<br><span class="caveat">${ac.walkDoubt}</span>`:'')+`</dd>`;
      } else if(ac.straight!=null){
        h+=`<dt>Distance</dt><dd>${accessDistance(ac.straight)} ${dim('in a straight line')}<br>${dim(NO_TRAILHEAD_NOTE)}</dd>`;
      }
      /* The alternatives, with their own figures. 16,091 cells hold an approach for a category the
         sheet does not name — the class precedence names the nearest trail, which often has no
         trailhead, while the road beside it has a perfectly good one — and all of it used to be
         invisible. Naming the other route instead would rename 16,091 cells, 12,331 of them from a
         road to a rough track, so the figures come to the alternatives rather than the name going
         to the figures. */
      if(ac.others.length) h+=`<dt>Also nearby</dt><dd>`+ac.others.map(o=>{
        const q=o.parts; let t=`${o.name||o.cat} ${accessDistance(o.m)} ${dim('off trail')}`;
        if(q&&q.onTrail!=null) t+=` ${dim('+ '+accessDistance(q.onTrail)+' '+onRouteLabel(o.cat)+(o.trailheadNote?', '+o.trailheadNote:'')
          +(q.total!=null?' = '+accessDistance(q.total):''))}`;
        return t;
      }).join('<br>')+`</dd>`;
      if(ac.way){
        const links=externalLinks(ac.way,e.lat,e.lon);
        h+=`<dt>Elsewhere</dt><dd>${links.map(l=>`<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a> ${dim('— '+l.note)}`).join('<br>')}</dd>`;
      }
      h+=`<dt>Sources</dt><dd>${dim('OpenStreetMap and USFS roads and trails. A way shown here is mapped, which is not the same as passable, open, or legal to use — coverage on private timberland is especially uneven. It never affects the score.')}</dd></dl>`;
      pendingWay = ac.wayIndex;
    }
  } else pendingWay = -1;     // nothing to draw, and nothing left over from the last cell
  if(e.w){
    const w=e.w,i=w.today; const days=[]; for(let d=Math.max(0,i-20);d<=i;d++) days.push(d); const mxp=Math.max(5,...days.map(d=>w.p[d]));
    h+=`<div class="sec">Rain, last 3 weeks (inches)</div><div class="rain">`+days.map(d=>`<div class="${w.p[d]>=10?'hi':''}"><b style="height:${Math.round(w.p[d]/mxp*38)}px"></b><span>${w.p[d]>=2.5?inch(w.p[d]).replace(/^0/,''):''}</span></div>`).join('')+`</div><p class="note">Left = 3 weeks ago, right = today. Lighter bars ≥0.4".</p>`;
  }
  /* The coordinate, for pasting into onX, Gaia, CalTopo, AllTrails or Google Maps. Decimal degrees
     with a minus sign rather than a hemisphere letter, because that is the form every one of them
     accepts in a search box. Selectable as well as copyable: the clipboard API is unavailable on an
     insecure origin and refused outright by some browsers, and a readout you cannot select would
     then be a dead end. */
  /* Say WHICH point this is. A cell sheet describes a square mile, so its coordinate is the cell
     centre — up to about 0.7 mi from wherever the finger actually landed — and an exact-point
     sheet is the point itself. Handing over a coordinate without saying which one it is would
     send someone to a spot they did not choose. */
  h+=`<div class="coords"><code id="coord-text">${formatCoords(e.lat,e.lon)}</code>`
    +`<button class="pill" id="btn-copy-coord">Copy</button></div>`
    +`<div style="margin:4px 0 0;font-size:12px">${dimAny(e.exact?"this exact point":"the centre of this cell")}</div>`;
  h+=`<div class="actions">${e.exact?'':`<button class="pill cap" id="btn-exact">Exact point forecast</button>`}<a class="pill" href="https://maps.apple.com/?ll=${e.lat},${e.lon}&q=Bolete%20spot" target="_blank" rel="noopener">Open in Maps</a><a class="pill" href="https://www.google.com/maps/@${e.lat},${e.lon},14z/data=!3m1!1e3" target="_blank" rel="noopener">Satellite</a></div>`;
  $('sheet-body').innerHTML=h;
  if(samePoint) $('sheet-body').scrollTop=prevScroll;
  const bx=$('btn-exact'); if(bx){ const tp=e.tap||[e.lat,e.lon]; bx.onclick=()=>exactPoint(tp[0],tp[1]); }
  const cc=$('btn-copy-coord');
  if(cc) cc.onclick=async()=>{
    const t=formatCoords(e.lat,e.lon);
    try{ await navigator.clipboard.writeText(t); cc.textContent='Copied'; }
    catch(_){ /* no clipboard permission, or an insecure origin: select it so a long-press copies */
      const r=document.createRange(); r.selectNodeContents($('coord-text'));
      const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); cc.textContent='Select & copy'; }
    setTimeout(()=>{ if(cc) cc.textContent='Copy'; },1600);
  };
  const stEl=$('stage-strip'), stDet=$('stage-detail');
  if(stEl) stEl.onclick=()=>{ stageOpen=!stageOpen; stEl.classList.toggle('open',stageOpen); stDet.hidden=!stageOpen; };
  const evEl=$('elev-strip'), evDet=$('elev-detail');
  if(evEl) evEl.onclick=()=>{ elevOpen=!elevOpen; evEl.classList.toggle('open',elevOpen); evDet.hidden=!elevOpen; };
  $('sheet-body').querySelectorAll('.fc>div').forEach((el,i)=>el.onclick=()=>showPoint(e,i));
  const dw=$('sheet-body').querySelector('.drawway');
  if(dw&&pendingWay>=0) dw.onclick=ev=>{ ev.preventDefault(); dw.textContent='Loading the line…'; drawApproach(pendingWay,e,dw); };
  map.panTo([e.lat,e.lon],{animate:true});
}

/* Draw the way the tap sheet just named, so the approach can be seen rather than imagined. One
   layer at a time: a second tap replaces the first rather than littering the map. Dashed, because a
   mapped way is not a promise about the ground. */
let approachLayer=null, geomFetch=null;
/* Geometry is 5.5 MB and only ever needed one line at a time, so it is fetched on the first request
   rather than at load. Fetched once and kept; a failure leaves the rest of the app untouched.

   The URL carries the bake's own `generated` stamp, and that is load-bearing. `force-cache` means
   "use the cached copy whatever its age", which is right for a large file that never changes at a
   given URL and wrong for one that is re-baked: a returning viewer kept the PREVIOUS bake's
   geometry forever. It happened on the first v4 deploy — access.json was v4 from the server while
   access-geom.json came back v3 from the disk cache, 53,200 entries against 50,614. The format
   check caught it and said "Could not load the line", which is the honest failure but still a
   broken feature; before that check existed the same staleness would have drawn wrong lines with no
   sign of trouble. Stamping the URL makes the cache entry change exactly when the data does, so
   force-cache becomes both safe and optimal. access.json is fetched no-cache, so the stamp is
   always the live one. */
async function loadAccessGeom(){
  if(!STATIC.access) return null;
  if(STATIC.access.geom) return STATIC.access.geom;
  if(!geomFetch) geomFetch=(async()=>{
    try{ const r=await fetch('data/access-geom.json?g='+encodeURIComponent(accessAsOf||''),{cache:'force-cache'});
      if(!r.ok) return null;
      const j=await r.json();
      // Same reasoning as access.json, one step further: a stale geometry file draws the wrong line.
      if(j.version!==ACCESS_FORMAT){
        console.warn(`access-geom.json is format v${j.version} — not drawing approaches`);
        return null;
      }
      STATIC.access.geom=j.geom||null; return STATIC.access.geom;
    }catch(_){ return null; }
  })();
  return geomFetch;
}
async function drawApproach(wayIndex,cell,link){
  const geoms=await loadAccessGeom();
  if(link) link.textContent='Show the approach on the map';
  if(!geoms){ if(link) link.textContent='Could not load the line'; return; }
  const way=decodeAccessWay(STATIC.access.ways[wayIndex],geoms[wayIndex]);
  if(approachLayer){ approachLayer.remove(); approachLayer=null; }
  if(!way||!way.geom||way.geom.length<2) return;
  const colour = way.cat==='trail'?'#5dcaa5':(way.cat==='road'?'#e58a2b':'#b8b09a');
  approachLayer=L.layerGroup([
    L.polyline(way.geom,{color:'#0f150f',weight:7,opacity:.55}),
    L.polyline(way.geom,{color:colour,weight:3,dashArray:'7 5'}),
  ]).addTo(map);
  const b=L.latLngBounds(way.geom).pad(0.25);
  if(cell) b.extend([cell.lat,cell.lon]);
  /* Only fit when the map actually has a viewport. The geometry file is fetched on demand, so this
     runs an unpredictable moment after the tap — and if iOS has backgrounded the page by then the
     container is 0x0, getBoundsZoom cannot fit anything into no pixels, and fitBounds lands on zoom
     0: you come back to the whole world instead of your trail. Defer to the next resize, which
     Leaflet fires when the pane becomes visible again. */
  const fit=()=>map.fitBounds(b);
  const sz=map.getSize();
  if(sz.x>0&&sz.y>0) fit();
  else map.once('resize',fit);
  closeSheet();
}

function showTop(){
  const pool=[...cells.values()].filter(e=>e.A&&!e.failed);
  const byK=new Map(); pool.forEach(e=>byK.set(key(e.lat,e.lon),e));
  const spread=(list,n,minMi)=>{ const out=[]; for(const e of list){ if(out.every(o=>dist([o.lat,o.lon],[e.lat,e.lon])>=minMi)) out.push(e); if(out.length>=n) break; } return out; };
  /* Sorting only. accessRank never enters a score — it reorders a list of cells that were already
     selected by score, so the same cells appear either way. */
  const scoreSort=(a,b)=>b.A.now.score-a.A.now.score;
  const accessSort=(a,b)=>accessRank(a.access)-accessRank(b.access)||scoreSort(a,b);
  const qualified=pool.filter(e=>e.A.now.score>=25);
  const all=spread(qualified.slice().sort(topSort==='access'?accessSort:scoreSort),8,10);
  const rising=spread(pool.filter(e=>e.A.best&&e.A.best.score>=45&&e.A.best.score>=e.A.now.score+10).sort((a,b)=>b.A.best.score-a.A.best.score),6,10);
  const near=userLoc? spread(pool.filter(e=>e.A.now.score>=25).sort((a,b)=>dist(userLoc,[a.lat,a.lon])-dist(userLoc,[b.lat,b.lon])),5,5):null;
  rising.slice(0,3).forEach(e=>{ const w=anchorHit(e.lat,e.lon).w;
    console.log(`[rising] ${e.lat}, ${e.lon}`,{fut:e.A.fut,habScore:e.hab.score,seasonNote:e.hab.seasonNote,'w.p':w&&w.p,'w.today':w&&w.today}); });
  openSheet('Where to go today',loading?'Still loading — best areas are scored first':'Best square miles across the state',true);
  const row=(e,useBest)=>{const s=Math.round(useBest?e.A.best.score:e.A.now.score);const peak=useBest?' on '+fmtDay(e.A.best.date):(e.A.best.score>e.A.now.score+5?' · peaks '+fmtDay(e.A.best.date):'');return `<div class="spot" data-k="${key(e.lat,e.lon)}"${useBest?' data-rising="1"':''}><div class="sc" style="background:${colorOf(s)||'#556a55'}">${s}</div><div class="m"><b>${e.hab.zone}</b><span>${ft(e.elev).toLocaleString()} ft${e.terr&&e.terr.aspect!=null?' · '+compass(e.terr.aspect)+' face':''} · ${e.lat.toFixed(2)}, ${e.lon.toFixed(2)}${userLoc?' · '+Math.round(dist(userLoc,[e.lat,e.lon]))+' mi':''}${peak}${STATIC.access?' · '+(accessDetail(e.access,STATIC.access.ways).wayName||ACCESS_CLASSES[classifyAccess(e.access)].label.toLowerCase()):''}</span></div></div>`;};
  let h='';
  const haveAccess=!!STATIC.access;
  if(haveAccess) h+=`<div class="sortbar">Sort: `
    +`<button class="pill${topSort==='score'?' on':''}" data-sort="score">Highest chance</button>`
    +`<button class="pill${topSort==='access'?' on':''}" data-sort="access">Easiest access</button></div>`;
  if(!all.length) h+=`<div class="empty">Nothing at medium or better anywhere scored so far. ${rising.length?'But conditions are building — see below.':'Play the timeline to see if rain is coming.'}</div>`;
  else h+=`<div class="sec">Highest chance now</div>`+all.map(e=>row(e)).join('');
  if(near&&near.length) h+=`<div class="sec">Closest to you (medium or better)</div>`+near.map(e=>row(e)).join('');
  if(rising.length) h+=`<div class="sec">Coming up this week</div>`+rising.map(e=>row(e,true)).join('');
  h+=`<p class="note">Each entry is one square mile; entries are kept at least 10 mi apart so you see distinct areas. Tap one to zoom there.`
    +`${haveAccess?' Access describes what is mapped in OpenStreetMap and USFS data, not what exists on the ground, and never changes a score.':''}</p>`;
  $('sheet-body').innerHTML=h;
  $('sheet-body').querySelectorAll('.sortbar .pill').forEach(b=>b.onclick=()=>{ topSort=b.dataset.sort; showTop(); });
  $('sheet-body').querySelectorAll('.spot').forEach(el=>el.onclick=()=>{ const e=byK.get(el.dataset.k); map.setView([e.lat,e.lon],11); if(marker) marker.remove(); marker=L.circleMarker([e.lat,e.lon],{radius:7,color:'#fff',weight:2,fillColor:'#b8742c',fillOpacity:1}).addTo(map); if(el.dataset.rising){ const bt=bestDayIndex(e); quickPlayTo(bt,()=>showPoint(e,bt)); } else showPoint(e); });
}

function showModel(){
  openSheet('How the forecast works','Model notes and what to trust',true);
  const wire=()=>{ const b=$('btn-export-weather'),n=$('export-note'); if(!b) return;
    b.onclick=()=>{ const k=exportWeather(); n.textContent=`Exported ${k} weather anchors. Put it at data/weather.json (the daily job will overwrite it).`; }; };
  setTimeout(wire,0);
  $('sheet-body').innerHTML=`<div class="model">
<p>The state is scored in one-square-mile cells. A fast terrain pass finds every cell that can hold king boletes (roughly a third of the state), a coarse weather pass ranks those areas, then the cells stream in best-first — whatever is in your view jumps the queue. Each cell gets a 0–100 chance for <i>today</i> plus a 7-day projection, from live Open-Meteo weather (30 days of history + forecast for that exact point) combined with a habitat model of Washington's forests. Score = habitat × trigger rain × soil moisture × temperature window × humidity, with kill switches for frost, snow and heat.</p>
<h3>Trigger rain</h3><p>Fruiting is set off by a soaking rain event, not by general dampness. The model looks for the best 3-day rain total of at least 0.4", scoring fully at ~1.6", in a window 3–24 days back. A flush ramps up from day 3, peaks days 9–15, and fades out by ~24 days — the pattern reported in <i>Boletus edulis</i> phenology studies (Spain, Italy, Pacific Northwest) and matched by forager experience: "a week to ten days after the first big fall rain."</p>
<h3>Soil moisture</h3><p>A simple bucket: rain in, 70% of reference evapotranspiration out, capped at 80 mm. A flush needs moisture to persist while primordia expand; a hot dry stretch after the trigger aborts it. This is the "chances were high but it dried out" case.</p>
<h3>Temperature</h3><p>Best with highs 50–72°F and lows 37–55°F. Above ~86°F fruiting shuts down; a hard frost (≤27°F) ends the fall season at that elevation. A cooling trend of 3.5°F+ over the previous week adds a bonus — temperature drop after rain is one of the strongest signals in the literature.</p>
<h3>Humidity</h3><p>3-day mean relative humidity; ≥70% is ideal, below 40% dries caps and slows growth. Coastal fog belts score well here.</p>
<h3>Habitat and season</h3><ul>
<li><b>Coastal Sitka spruce belt</b> (Olympic coast, Grays Harbor, Long Beach, Strait) — Oct–Nov, low elevation, spruce and shore pine.</li>
<li><b>West Cascades / Olympic montane</b> — late Aug–mid Oct under true firs, hemlock, white pine. The productive elevation band drops from ~4,500 ft in August to ~2,000 ft by November; the model tracks that.</li>
<li><b>East Cascades, Okanogan, Selkirks, Blues</b> — fall under spruce/fir, plus the spring king (<i>B. rex-veris</i>) May–June following snowmelt upslope.</li>
<li><b>Puget lowland</b> — weighted low: Douglas-fir is a poor host; look for planted spruce, pine and fir.</li>
<li><b>Shrub-steppe and alpine</b> — scored near zero.</li></ul>
<p>Each cell is also checked against LANDFIRE 2024 (USGS, 30 m): four samples per square mile of vegetation type, tree canopy cover and stand height. Cells with no tree cover drop out; young regenerating stands under ~25 ft are heavily marked down; and the named vegetation type sets a host-quality factor — Sitka spruce, silver fir, mountain hemlock and spruce-fir systems score full, Douglas-fir–hemlock moderate, hardwoods, shrub, harvested regeneration and non-forest low or zero. LANDFIRE is a model of vegetation, not a survey, so treat it as a strong hint — Use the topo (green = forest) and satellite basemaps to pick real stands of the host trees, then tap the exact spot for a point forecast.</p>
<h3>Elevation, slope and aspect</h3><p>Weather is pulled at anchor points every ~14 mi (about 450 across the state's forest), which is the only API traffic — roughly a fifth of Open-Meteo's free daily quota per full load. Every cell and every tapped spot then gets its own elevation from open terrain tiles (Mapzen/AWS Terrarium, ~100 m resolution, decoded in the browser so it costs no API calls), and temperatures are shifted by the standard lapse rate (3.5°F per 1,000 ft). Slope and aspect come from the surrounding terrain: north-facing slopes are modeled ~2°F cooler and lose moisture ~18% slower, south-facing the reverse — so early-season north slopes and late-season sunny slopes score the way experienced foragers expect. Weather itself comes from NOAA/ECMWF model grids that assimilate the regional station network; the app does not read individual stations directly.</p>
<h3>Data files</h3><p>For a public deployment the app reads two static files instead of calling any API from the phone: <code>data/cells.json</code> (elevation, slope, aspect and LANDFIRE vegetation for every cell — baked by <code>scripts/build-cells.mjs</code>) and <code>data/weather.json</code> (all weather anchors — refreshed once a day by the GitHub Actions job in the repo). Export after a complete live load.</p>
<div class="actions"><button class="pill" id="btn-export-weather">Export weather.json</button></div><p class="note" id="export-note"></p>
<h3>Reading the number</h3><ul><li>Medium 25–44 · Good 45–64 · High 65–79 · Very high 80+</li><li>"Rising" means the trigger has happened but the flush hasn't surfaced yet.</li><li>"Past prime" means you'll mostly find aged, maggoty caps.</li></ul>
<p>Sources of weather: Open-Meteo best-match model (NOAA GFS/HRRR blended with ICON, ERA5-based reanalysis for history). Mountain microclimates vary; treat any cell as a hypothesis, not a promise.</p></div>`;
}

/* ===================== CONTROLS ===================== */
$('btn-top').onclick=showTop;
$('btn-model').onclick=showModel;
$('btn-refine').onclick=refine;
$('btn-refresh').onclick=()=>{ if(approachLayer){ approachLayer.remove(); approachLayer=null; } apiBlocked=null; STATIC.tried=false; STATIC.cells=null; STATIC.weather=null; let miss=0; for(const e of cells.values()) if(!e.A||e.failed) miss++; if(!miss) wcache.clear(); loadState(); };
$('btn-layers').onclick=ev=>{ ev.stopPropagation(); $('layers').classList.toggle('open'); };
/* Go to a pasted coordinate. The parser is in src/coords.mjs and is strict: anything it cannot read
   returns null and says so here, rather than dropping a pin somewhere plausible. */
const gotoErr=t=>{ const el=$('goto-err'); el.textContent=t||''; el.classList.toggle('show',!!t); };
$('btn-goto').onclick=ev=>{ ev.stopPropagation();
  const g=$('goto'); const open=g.classList.toggle('open');
  gotoErr(''); if(open){ $('goto-input').focus(); $('goto-input').select(); } };
$('goto-close').onclick=()=>{ $('goto').classList.remove('open'); gotoErr(''); };
$('goto').onclick=ev=>ev.stopPropagation();
function gotoSubmit(){
  const raw=$('goto-input').value;
  const c=parseCoords(raw);
  if(!c){ gotoErr('Could not read a coordinate pair from that.'); return; }
  if(!inWA(c.lat,c.lon)){ gotoErr(formatCoords(c.lat,c.lon)+' is outside Washington.'); return; }
  gotoErr(''); $('goto').classList.remove('open');
  /* Zoom in far enough that the marker is obviously in one cell, then hand over to the same
     resolution a tap uses. */
  map.setView([c.lat,c.lon],Math.max(map.getZoom(),13));
  showAt(c.lat,c.lon);
}
$('goto-add').onclick=gotoSubmit;
$('goto-input').addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); gotoSubmit(); } });
$('btn-base').onclick=()=>{ bases[baseOrder[baseIdx]].remove(); baseIdx=(baseIdx+1)%baseOrder.length; bases[baseOrder[baseIdx]].addTo(map); setStatus(['Satellite','Topo map','USGS topo'][baseIdx]); };
$('btn-loc').onclick=()=>{ if(!navigator.geolocation){setStatus('Location not available');return;} setStatus('Finding you…'); navigator.geolocation.getCurrentPosition(pos=>{ userLoc=[pos.coords.latitude,pos.coords.longitude]; L.circleMarker(userLoc,{radius:6,color:'#fff',weight:2,fillColor:'#4a90d9',fillOpacity:1}).addTo(map); map.setView(userLoc,9); setStatus('Centered on your location'); },()=>setStatus('Location permission denied'),{enableHighAccuracy:false,timeout:10000}); };

loadState();
/* Module scope is not the global scope. The verification snippets in docs/verification.md — the ones under
   "Verification that has actually caught bugs", which are run by hand in the browser console — refer
   to these by name, so expose them deliberately rather than letting the move quietly break them. */
Object.assign(window,{anchorHit,snapLattice,key,cells,wcache,STATIC,habitat,analyze,fullAnalysis,vegMult,
  /* showPoint and the Leaflet instance are here so the tap sheet can be driven from a console. It
     is the part of the app a test cannot reach, and the "dim is not defined" crash in the access
     block was caught by opening it by hand rather than by any assertion. */
  showPoint,leafletMap:map,showAt,parseCoords,formatCoords});
// WBASE/WCOARSE/WLATTICE are reassigned when the archive loads, so bind them live rather than
// copying whatever they happened to hold at startup.
Object.defineProperties(window,{WBASE:{get:()=>WBASE},WCOARSE:{get:()=>WCOARSE},WLATTICE:{get:()=>WLATTICE}});

</script>
